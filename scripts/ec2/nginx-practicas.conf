# PracTI — frontend estático + API Spring Boot en localhost:8080
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/practicas;
    index index.html;

    client_max_body_size 25M;

    # Rutas del frontend (no deben ir al API Spring)
    location ~ ^/evaluaciones(/|$) {
        try_files $uri $uri/ /index.html;
    }

    location = /calificaciones {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/calificaciones/[0-9]+/?$ {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(auth|dashboard|admin|asignaciones|vinculaciones|vacantes|empresas|estudiantes|expedientes|docentes-asesores|seguimiento|calificaciones|cierres|encuestas|notificaciones|reportes|respaldo|catalogos|configuracion|facultades|programas|practicas|tutores|error|actuator)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
