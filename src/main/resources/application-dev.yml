# Perfil desarrollo: BD local + logging DEBUG
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/practicas_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:ehs012407@gmail.com}
    password: ${MAIL_PASSWORD}
    from-name: "Sistema de Prácticas"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    com.avh.practicas: DEBUG

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:clave-secreta-avh-2026-practicas-empresariales-sistema}

mail:
  mode: smtp