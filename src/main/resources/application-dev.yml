# Perfil desarrollo: BD local + logging DEBUG
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/practicas_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.avh.practicas: DEBUG

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:clave-secreta-avh-2026-practicas-empresariales-sistema}

mail:
  mode: stub

app:
  documentos:
    storage-path: ${DOCUMENTOS_STORAGE_PATH:./storage/documentos}
