# Perfil desarrollo: BD local + logging DEBUG
# Credenciales SMTP: usar variables de entorno o application-dev-local.yml (no commitear secretos).
spring:
  config:
    import: optional:classpath:application-dev-local.yml,optional:file:./application-dev-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/practicas_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: ${MAIL_FROM_NAME:Sistema de Prácticas}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    com.avh.practicas: DEBUG

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:clave-secreta-avh-2026-practicas-empresariales-sistema}

mail:
  mode: ${MAIL_MODE:stub}

# Orígenes del frontend permitidos por CORS (separados por coma).
# Sobrescribir en despliegue: CORS_ALLOWED_ORIGINS=https://app.tudominio.com
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:3000,http://localhost:4200}
